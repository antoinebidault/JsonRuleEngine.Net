image: Visual Studio 2026
version: 2.0.{build}
build: off

before_build:
  - choco install codecov

build_script:
  - dotnet restore -v quiet
  - dotnet test -p:CollectCoverage=true -p:CoverletOutputFormat=opencover
  - ps: codecov -f "JsonRuleEngine.Net.Tests/coverage.opencover.xml" -t $($env:CODECOV_TOKEN)
  - ps: dotnet build JsonRuleEngine.Net\JsonRuleEngine.Net.csproj -c Release -p:Version=$env:APPVEYOR_BUILD_VERSION

test: off

artifacts:
  - path: JsonRuleEngine.Net\bin\Release\*.nupkg
    name: NuGet package
